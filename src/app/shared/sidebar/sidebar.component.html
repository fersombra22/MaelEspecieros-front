<aside class="sidebar d-flex flex-column">
  <!-- Marca / Logo -->
  <div
    class="brand d-flex align-items-center gap-3 px-4 py-4 border-bottom border-secondary border-opacity-25"
  >
    <div
      class="bg-white rounded p-1 d-flex align-items-center justify-content-center shadow-sm logo-container"
    >
      <img src="logo.png?v=2" alt="Logo" class="img-fluid img-contain" />
    </div>
    <div class="brand-text d-flex flex-column">
      <h2 class="h5 mb-0 fw-bold text-white">Mael</h2>
      <span class="text-white-50 small txt-xs">Especieros ERP</span>
    </div>
  </div>

  <!-- Navegación -->
  <nav class="sidebar-nav flex-grow-1 overflow-auto py-3 px-3">
    <ul class="list-unstyled mb-0 d-flex flex-column gap-1">
      <!-- General -->
      <li class="nav-section mt-2 mb-2 px-3 text-uppercase fw-bold text-white-50 nav-section-title">
        General
      </li>
      <li>
        <a
          routerLink="/dashboard"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: true }"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-house text-center icon-sm"></i>
          <span>Dashboard</span>
        </a>
      </li>

      <!-- Inventario -->
      <li class="nav-section mt-4 mb-2 px-3 text-uppercase fw-bold text-white-50 nav-section-title">
        Inventario
      </li>
      <li>
        <a
          routerLink="/productos"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-box text-center icon-sm"></i>
          <span>Productos</span>
        </a>
      </li>
      <li *ngIf="usuario?.rol !== Rol.EMPLEADO">
        <a
          routerLink="/categorias"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-layer-group text-center icon-sm"></i>
          <span>Categorías</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/movimientos"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-arrow-right-arrow-left text-center icon-sm"></i>
          <span>Movimientos</span>
        </a>
      </li>

      <!-- Ventas -->
      <li class="nav-section mt-4 mb-2 px-3 text-uppercase fw-bold text-white-50 nav-section-title">
        Ventas
      </li>
      <li>
        <a
          routerLink="/ventas"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-cart-plus text-center icon-sm"></i>
          <span>Nueva venta</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/ventas/historial"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-file-invoice text-center icon-sm"></i>
          <span>Historial</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/caja"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-cash-register text-center icon-sm"></i>
          <span>Caja y Turnos</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/clientes"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-users text-center icon-sm"></i>
          <span>Clientes</span>
        </a>
      </li>

      <!-- Administración -->
      <li
        *ngIf="usuario?.rol !== Rol.EMPLEADO"
        class="nav-section mt-4 mb-2 px-3 text-uppercase fw-bold text-white-50 nav-section-title"
      >
        Administración
      </li>
      <li *ngIf="usuario?.rol === Rol.ADMIN || usuario?.rol === Rol.SUPER_ADMIN">
        <a
          routerLink="/usuarios"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-users text-center icon-sm"></i>
          <span>Usuarios</span>
        </a>
      </li>
      <li *ngIf="usuario?.rol === Rol.ADMIN || usuario?.rol === Rol.SUPER_ADMIN">
        <a
          routerLink="/reportes"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-chart-line text-center icon-sm"></i>
          <span>Reportes</span>
        </a>
      </li>

      <!-- Seguridad -->
      <li
        *ngIf="usuario?.rol === Rol.SUPER_ADMIN"
        class="nav-section mt-4 mb-2 px-3 text-uppercase fw-bold text-white-50 nav-section-title"
      >
        Seguridad
      </li>
      <li *ngIf="usuario?.rol === Rol.SUPER_ADMIN">
        <a
          routerLink="/blockchain"
          routerLinkActive="active"
          class="nav-link rounded px-3 py-2 d-flex align-items-center gap-3 text-white-50"
        >
          <i class="fa-solid fa-link text-center icon-sm"></i>
          <span>Blockchain</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer del Sidebar -->
  <div class="sidebar-footer p-4 border-top border-secondary border-opacity-25 mt-auto">
    <div class="d-flex align-items-center gap-2 text-success txt-sm">
      <i class="fa-solid fa-shield-halved"></i>
      <span class="fw-semibold">Sistema Seguro</span>
    </div>
  </div>
</aside>
