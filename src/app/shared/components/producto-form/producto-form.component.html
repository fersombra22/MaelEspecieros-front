<form [formGroup]="formulario" (ngSubmit)="enviar()">
  <!-- DATOS PRINCIPALES -->
  <div class="form-grid">
    <div class="floating-label full-width">
      <input
        type="text"
        class="premium-input"
        id="prod-nombre"
        placeholder="Ej: Especiero giratorio"
        formControlName="nombre"
      />
      <label for="prod-nombre">Nombre del producto</label>
      <small
        class="error"
        *ngIf="formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched"
      >
        El nombre es obligatorio.
      </small>
    </div>

    <div class="floating-label full-width">
      <input
        type="text"
        class="premium-input"
        id="prod-modelo"
        placeholder="Ej: Modelo 3 niveles"
        formControlName="modelo"
      />
      <label for="prod-modelo">Modelo</label>
    </div>

    <div class="floating-label full-width">
      <textarea
        class="premium-input"
        id="prod-desc"
        rows="2"
        placeholder="Detalle del producto..."
        formControlName="descripcion"
      ></textarea>
      <label for="prod-desc">Descripción</label>
    </div>

    <!-- PRECIOS -->
    <div class="floating-label">
      <input
        type="number"
        class="premium-input"
        id="prod-efectivo"
        placeholder="Ej: 5000"
        formControlName="precioEfectivo"
      />
      <label for="prod-efectivo">Precio efectivo</label>
    </div>

    <div class="floating-label">
      <input
        type="number"
        class="premium-input"
        id="prod-costo"
        placeholder="Ej: 3000"
        formControlName="costo"
      />
      <label for="prod-costo">Costo</label>
    </div>

    <div class="floating-label">
      <select class="premium-input" id="prod-categoria" formControlName="categoriaId">
        <option [ngValue]="null">Seleccione categoría...</option>
        <option *ngFor="let categoria of categorias" [ngValue]="categoria.id">
          {{ categoria.nombre }}
        </option>
      </select>
      <label for="prod-categoria">Categoría</label>
    </div>

    <!-- STOCK -->
    <div class="floating-label">
      <input
        type="number"
        class="premium-input"
        id="prod-stock"
        placeholder="Ej: 50"
        formControlName="stock"
      />
      <label for="prod-stock">Stock actual</label>
    </div>

    <div class="floating-label">
      <input
        type="number"
        class="premium-input"
        id="prod-stockmin"
        placeholder="Ej: 10"
        formControlName="stockMinimo"
      />
      <label for="prod-stockmin">Stock mínimo</label>
    </div>
  </div>

  <div class="acciones-form">
    <button type="button" class="btn-cancelar" (click)="cerrar()">
      Cancelar
    </button>
    <button type="submit" class="btn-guardar">
      <i class="fa-solid fa-floppy-disk"></i>
      {{ productoEditar ? 'Actualizar' : 'Guardar' }}
    </button>
  </div>
</form>
