<form class="cliente-form" [formGroup]="formulario" (ngSubmit)="enviar()">
  <div class="form-header">
    <div class="form-icon">
      <i class="fa-solid fa-user-plus" *ngIf="!clienteEditar"></i>
      <i class="fa-solid fa-user-pen" *ngIf="clienteEditar"></i>
    </div>

    <div>
      <h3>
        {{ clienteEditar ? 'Editar Cliente' : 'Nuevo Cliente' }}
      </h3>
      <p>Complete los datos personales y de contacto del cliente.</p>
    </div>
  </div>

  <div class="form-grid">
    <!-- NOMBRE -->
    <div class="campo">
      <label>Nombre <span class="required">*</span></label>
      <input type="text" formControlName="nombre" placeholder="Ej. Juan" />
      <small
        class="error"
        *ngIf="formulario.get('nombre')?.invalid && formulario.get('nombre')?.touched"
      >
        El nombre es obligatorio (máx. 80 caracteres).
      </small>
    </div>

    <!-- APELLIDO -->
    <div class="campo">
      <label>Apellido <span class="required">*</span></label>
      <input type="text" formControlName="apellido" placeholder="Ej. Pérez" />
      <small
        class="error"
        *ngIf="formulario.get('apellido')?.invalid && formulario.get('apellido')?.touched"
      >
        El apellido es obligatorio (máx. 80 caracteres).
      </small>
    </div>

    <!-- EMAIL -->
    <div class="campo">
      <label>Correo Electrónico <span class="required">*</span></label>
      <input type="email" formControlName="email" placeholder="ejemplo@correo.com" />
      <small
        class="error"
        *ngIf="formulario.get('email')?.invalid && formulario.get('email')?.touched"
      >
        Ingrese un correo electrónico válido.
      </small>
    </div>

    <!-- TELÉFONO -->
    <div class="campo">
      <label>Teléfono / Celular</label>
      <input type="text" formControlName="telefono" placeholder="+54 9 11 1234-5678" />
    </div>

    <!-- DIRECCIÓN (FULL WIDTH) -->
    <div class="campo col-span-2">
      <label>Dirección</label>
      <input
        type="text"
        formControlName="direccion"
        placeholder="Calle, número, localidad, provincia"
      />
    </div>

    <!-- ESTADO / ACTIVO -->
    <div class="campo col-span-2" *ngIf="clienteEditar">
      <div class="switch-container">
        <label class="switch-label">
          <input type="checkbox" formControlName="activo" class="form-check-input me-2" />
          <span>Cliente Activo (Habilitado para transacciones)</span>
        </label>
      </div>
    </div>
  </div>

  <div class="botones">
    <button type="button" class="btn-cancelar" (click)="cerrar()">
      <i class="fa-solid fa-xmark"></i>
      Cancelar
    </button>

    <button type="submit" class="btn-guardar">
      <i class="fa-solid fa-floppy-disk"></i>
      {{ clienteEditar ? 'Actualizar Cliente' : 'Guardar Cliente' }}
    </button>
  </div>
</form>
